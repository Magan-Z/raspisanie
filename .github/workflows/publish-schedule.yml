# Публикация расписания на GitHub Pages.
# Запускается, когда меняется что-то в папке data/ (например, загружен новый xlsx),
# или вручную: вкладка Actions → «Публикация расписания» → Run workflow.
name: Публикация расписания

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "app/**"            # веб-версия приложения (для iPhone) собирается вместе с сайтом
      - "scripts/build_web.sh"
      - ".github/workflows/publish-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две публикации одновременно не запускаем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements.txt

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Тесты
        run: python -m pytest

      - name: Адрес сайта
        id: pages
        uses: actions/configure-pages@v5

      # Если проверки не пройдут, шаг упадёт, GitHub пришлёт письмо,
      # а на сайте останется прошлая (хорошая) версия.
      - name: Разбор расписания
        run: python -m schedule_parser --out ../public --previous "${{ steps.pages.outputs.base_url }}/"

      # Главная страница сайта (лендинг): index.html, листовка, QR, картинки и шрифт из data/web
      - name: Главная страница сайта
        run: |
          cp -R web/. ../public/
          touch ../public/.nojekyll

      # APK лежит на самом сайте, поэтому кнопка «Скачать» не уводит на GitHub. Берём файл из последнего выпуска (Releases);
      # apk.json — версия и размер для подписи под кнопкой. Если скачать не вышло, сайт всё равно публикуется (с предупреждением).
      - name: APK на сайте
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if gh release download --repo "${{ github.repository }}" --pattern "*.apk" --dir ../public --clobber; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" = 1 ]; then
            # файл в выпуске мог называться по-старому (raspisanie.apk): на сайте он всегда unigraf.apk
            apk=$(ls ../public/*.apk | head -1)
            [ "$apk" = ../public/unigraf.apk ] || mv "$apk" ../public/unigraf.apk
            size=$(stat -c %s ../public/unigraf.apk)
            tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
            # min — самая старая версия, которой ещё можно пользоваться (файл data/min-app-version.txt, обычно 0.0.0)
            min=$(tr -cd '0-9.' < min-app-version.txt 2>/dev/null || true)
            [ -n "$min" ] || min=0.0.0
            printf '{"version":"%s","size":%s,"min":"%s"}\n' "${tag#v}" "$size" "$min" > ../public/apk.json
            echo "APK $tag, $size байт"
          else
            echo "::warning::Не удалось скачать APK из последнего выпуска: на сайте не будет файла для скачивания"
          fi

      # Веб-версия приложения для iPhone: тот же интерфейс, что на Android, но в браузере (кроме виджетов и напоминаний).
      # Собирается с самым свежим расписанием внутри, лежит на сайте по адресу /app/.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Веб-версия приложения
        working-directory: .
        env:
          BASE_HREF: /${{ github.event.repository.name }}/app/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          rm -rf app/assets/schedule && mkdir -p app/assets/schedule/groups
          cp public/index.json app/assets/schedule/
          cp public/groups/*.json app/assets/schedule/groups/
          (cd app && flutter pub get && dart run build_runner build --delete-conflicting-outputs)
          bash scripts/build_web.sh
          cp -R app/build/web public/app

      # Тестовая версия нового дизайна: если на GitHub есть ветка design-test, она собирается отдельно
      # и лежит на сайте по адресу /app-next/ (тестовая главная страница — на /site-next/). Обычная версия (/app/) от неё не зависит.
      - name: "Тестовая версия веб-приложения (ветка design-test)"
        working-directory: .
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          if git ls-remote --exit-code --heads origin design-test >/dev/null 2>&1; then
            git fetch --depth=1 origin design-test
            git worktree add test-src FETCH_HEAD
            mkdir -p test-src/app/assets/schedule/groups
            cp public/index.json test-src/app/assets/schedule/
            cp public/groups/*.json test-src/app/assets/schedule/groups/
            (cd test-src/app && flutter pub get && dart run build_runner build --delete-conflicting-outputs)
            NEXT=1 BASE_HREF=/${{ github.event.repository.name }}/app-next/ bash test-src/scripts/build_web.sh
            cp -R test-src/app/build/web public/app-next
            # Тестовая главная страница: лежит на /site-next/, а приложение, APK и расписание берёт с основного сайта (на уровень выше)
            mkdir -p public/site-next
            cp -R test-src/data/web/. public/site-next/
            sed -i 's#<meta name="site-root" content="">#<meta name="site-root" content="../">#' public/site-next/index.html
          else
            echo "Ветки design-test нет: тестовая версия не собирается"
          fi

      - name: Отчёт в журнал
        if: always()
        run: cat ../public/report.txt || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
