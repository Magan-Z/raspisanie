# Проверка приложения при любом изменении в папке app/: анализ кода и тесты.
name: Проверка приложения

on:
  push:
    paths: ["app/**", "scripts/build_web.sh", ".github/workflows/test-app.yml"]
  pull_request:
    paths: ["app/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart analyze lib test
      - run: flutter test
      # Веб-версия должна собираться (иначе iPhone-версия сломается незаметно)
      - run: bash scripts/build_web.sh
        working-directory: .
      # Тесты логики виджетов (Kotlin). Нужна хотя бы одна сборка Flutter, чтобы Gradle знал плагины.
      - run: flutter build apk --debug --target-platform android-arm64
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: app/android
