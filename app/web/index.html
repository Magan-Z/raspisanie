<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Адрес, по которому лежит приложение; при сборке подставляется значение --base-href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="UniGraf: расписание института, аудитории, домашка, поиск">
  <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1217" media="(prefers-color-scheme: dark)">

  <!-- iPhone: «Добавить на экран Домой» превращает страницу в приложение без адресной строки -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UniGraf">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>UniGraf</title>

  <style>
    /* Фон страницы совпадает с фоном приложения — при загрузке и в «полосах» под строкой состояния нет белых вспышек */
    html, body { margin: 0; height: 100%; background: #F4F6F9; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1217; } }
    /* Экран загрузки (пока открывается приложение) */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, system-ui, sans-serif; color: #51565A; gap: 16px; }
    @media (prefers-color-scheme: dark) { #boot { color: #B5BEC0; } }
    #boot img { width: 72px; height: 72px; border-radius: 20px; }
    #boot .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(11,85,99,.18); overflow: hidden; }
    #boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #0B397E; border-radius: 2px;
                        animation: slide 1.1s ease-in-out infinite; }
    #boot .hint { max-width: 260px; text-align: center; font-size: 13px; line-height: 1.4; opacity: .8; }
    #boot .hint[hidden] { display: none; }
    /* Плавный переход от заставки к приложению: заставка гаснет, приложение проявляется */
    #boot { transition: opacity .3s ease-out; }
    #boot.leaving { opacity: 0; }
    flutter-view { opacity: 0; transition: opacity .35s ease-out; }
    body.app-ready flutter-view { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #boot, flutter-view { transition: none; } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <script>
    // Проверочный режим: адрес вида .../app/?dpr=2 ограничивает плотность пикселей холста. Нужен, чтобы сравнить плавность
    // на телефонах с очень плотным экраном (приложение рисуется на холсте, и чем больше пикселей, тем тяжелее каждый кадр).
    (function () {
      var m = /[?&]dpr=([0-9.]+)/.exec(location.search);
      var cap = m ? parseFloat(m[1]) : 0;
      if (!(cap >= 1 && cap <= 4)) return;
      var real = window.devicePixelRatio;
      try { Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return Math.min(real, cap); } }); } catch (e) {}
    })();
  </script>
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>Загружаем расписание…</div>
    <div class="hint" id="boot-hint" hidden>Первый запуск самый долгий: скачивается около 5 МБ. Дальше приложение будет открываться сразу и даже без интернета.</div>
  </div>
  <script>
    // Пока грузится само приложение (это самое долгое), заранее скачиваем файлы базы данных:
    // иначе они начали бы грузиться только после запуска и растянули бы ожидание.
    ['sqlite3.wasm', 'drift_worker.js'].forEach(function (name) {
      fetch(name).catch(function () {});
    });

    // Если загрузка затянулась (медленный интернет) — объясняем, почему так и что дальше будет быстрее
    var hintTimer = setTimeout(function () {
      var hint = document.getElementById('boot-hint');
      if (hint) hint.hidden = false;
    }, 3500);

    // Когда приложение нарисовало первый кадр: заставка плавно гаснет, приложение проявляется
    var appShown = false;
    function showApp() {
      if (appShown) return;
      appShown = true;
      clearTimeout(hintTimer);
      document.body.classList.add('app-ready');
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('leaving');
        setTimeout(function () { boot.remove(); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', function () {
      showApp();
      // Кэш приложения включаем уже после первого кадра, чтобы он не мешал самой загрузке (см. sw.js)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
    // Страховка: если по какой-то причине первый кадр не сообщил о себе, приложение всё равно покажется
    setTimeout(showApp, 20000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
