<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Адрес, по которому лежит приложение; при сборке подставляется значение --base-href -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Расписание института: пары, аудитории, домашка, поиск">
  <meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1416" media="(prefers-color-scheme: dark)">

  <!-- iPhone: «Добавить на экран Домой» превращает страницу в приложение без адресной строки -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Расписание">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Расписание</title>

  <style>
    /* Фон страницы совпадает с фоном приложения — при загрузке и в «полосах» под строкой состояния нет белых вспышек */
    html, body { margin: 0; height: 100%; background: #FBF8F3; }
    @media (prefers-color-scheme: dark) { html, body { background: #0E1416; } }
    /* Экран загрузки (пока открывается приложение) */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, system-ui, sans-serif; color: #51565A; gap: 16px; }
    @media (prefers-color-scheme: dark) { #boot { color: #B5BEC0; } }
    #boot img { width: 72px; height: 72px; border-radius: 20px; }
    #boot .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(11,85,99,.18); overflow: hidden; }
    #boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #0B5563; border-radius: 2px;
                        animation: slide 1.1s ease-in-out infinite; }
    #boot .hint { max-width: 260px; text-align: center; font-size: 13px; line-height: 1.4; opacity: .8; }
    #boot .hint[hidden] { display: none; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>Загружаем расписание…</div>
    <div class="hint" id="boot-hint" hidden>Первый запуск самый долгий: скачивается около 5 МБ. Дальше приложение будет открываться сразу и даже без интернета.</div>
  </div>
  <script>
    // Пока грузится само приложение (это самое долгое), заранее скачиваем файлы базы данных:
    // иначе они начали бы грузиться только после запуска и растянули бы ожидание.
    ['sqlite3.wasm', 'drift_worker.js'].forEach(function (name) {
      fetch(name).catch(function () {});
    });

    // Если загрузка затянулась (медленный интернет) — объясняем, почему так и что дальше будет быстрее
    var hintTimer = setTimeout(function () {
      var hint = document.getElementById('boot-hint');
      if (hint) hint.hidden = false;
    }, 3500);

    // Экран загрузки убираем, когда приложение нарисовало первый кадр
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(hintTimer);
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
      // Кэш приложения включаем уже после первого кадра, чтобы он не мешал самой загрузке (см. sw.js)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
